name: Build and publish desktop releases

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
          - label: linux-x64
            os: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run build:win

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run build:linux

      - name: Upload Windows build artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: fhcc-windows-x64
          path: |
            dist/FHCC-Setup-*.exe
            dist/FHCC-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fhcc-linux-x64
          path: |
            dist/FHCC-*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish combined GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows and Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: fhcc-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: FHCC ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
