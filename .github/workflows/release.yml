name: Build and publish desktop releases

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
          - label: linux-x64
            os: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Die komplette Release-Verifikation laeuft genau einmal pro Plattform und
      # wird im Log gesichert. Ohne dieses Log bleibt bei einem Abbruch nur
      # "exit code 1" - ohne Hinweis, welches Skript und welche Assertion.
      # Bewusst OHNE `| tee`: bricht die Pipe (z. B. volle Platte), stirbt der
      # Build still und das Log endet genau dort, wo die Ursache liegen
      # wuerde. Das Log landet vollstaendig in der Datei, die letzten Zeilen
      # erscheinen zusaetzlich im Schritt-Output.
      - name: Run release verification suite
        shell: bash
        run: |
          npm run test:release > verify.log 2>&1
          status=$?
          tail -n 200 verify.log
          exit $status

      - name: Report verification failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Release-Verifikation fehlgeschlagen"
            echo '```text'
            tail -n 60 verify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotationen sind auch ohne Token ueber die oeffentliche API lesbar.
          # GitHub zeigt hoechstens 10 davon - deshalb zuerst die Zeilen, die wie
          # eine Fehlermeldung aussehen, erst danach das Log-Ende.
          { grep -aiE 'error|fehler|⨯|fail|assert|exception|enoent|exited with' verify.log | tail -n 8; tail -n 6 verify.log; } \
            | tr -d '\r' | sed '/^[[:space:]]*$/d' | awk '!seen[$0]++' | head -n 10 | while IFS= read -r line; do
            printf '::error title=Release-Verifikation::%s\n' "${line//'%'/'%25'}"
          done

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Kein fhcc-*-Praefix: der Publish-Job laedt per Muster nur echte Pakete.
          name: verify-log-${{ matrix.label }}
          path: verify.log
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
          - label: linux-x64
            os: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            printf '::error title=Release-Version::Tag %s passt nicht zu package.json %s\n' "$GITHUB_REF_NAME" "$expected"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # WICHTIG: Das Log darf nicht im Projektverzeichnis liegen.
          # electron-builder packt dieses Verzeichnis, und eine Datei, die
          # waehrend des Packens waechst, verschiebt die ASAR-Datensektion
          # gegen die Header-Offsets - das Ergebnis ist ein Archiv, in dem
          # jede Datei die Inhalte ihrer Nachbarn liefert.
          mkdir -p dist/logs
          npm run build:win:ci > dist/logs/build.log 2>&1
          status=$?
          tail -n 200 dist/logs/build.log
          exit $status

      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/logs
          npm run build:linux:ci > dist/logs/build.log 2>&1
          status=$?
          tail -n 200 dist/logs/build.log
          exit $status

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          mkdir -p dist/logs
          cp -f dist/logs/build.log build-tail.log 2>/dev/null || cp -f build.log build-tail.log 2>/dev/null || : > build-tail.log
          tail -n 120 build-tail.log > build-tail.trimmed.log || : > build-tail.trimmed.log
          {
            echo "### Build fehlgeschlagen"
            echo '```text'
            cat build-tail.trimmed.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Die eigentliche Ursache steht oft in einer Zeile, die weder nach
          # "error" aussieht noch im Log-Ende liegt (z. B. "Archiv-Inhalt weicht
          # ab ..."). Diese Zeilen kommen deshalb zuerst und als EIGENE
          # Annotation - Annotationen mit "error" im Text werden sonst schon
          # vorher weggefiltert.
          { grep -aE 'weicht ab|nicht im Archiv|fehlt im Arbeitsordner|PRUEFUNG fehlgeschlagen' build-tail.trimmed.log || :; } \
            | tr -d '\r' | sed '/^[[:space:]]*$/d' | awk '!seen[$0]++' | head -n 4 | while IFS= read -r line; do
            printf '::error title=Archiv-Inhalt::%s\n' "${line//'%'/'%25'}"
          done
          # GitHub zeigt hoechstens 10 Annotationen - deshalb zuerst die Zeilen,
          # die wie eine Fehlermeldung aussehen, erst danach das Log-Ende.
          { grep -aiE 'error|fehler|⨯|fail|assert|exception|enoent|exited with' build-tail.trimmed.log | tail -n 6; tail -n 4 build-tail.trimmed.log; } \
            | tr -d '\r' | sed '/^[[:space:]]*$/d' | awk '!seen[$0]++' | head -n 6 | while IFS= read -r line; do
            printf '::error title=Build::%s\n' "${line//'%'/'%25'}"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.label }}
          path: dist/logs/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows build artifacts
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: fhcc-windows-x64
          path: |
            dist/FHCC-Setup-*.exe
            dist/FHCC-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux build artifacts
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: fhcc-linux-x64
          path: |
            dist/FHCC-*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish combined GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows and Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: fhcc-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: FHCC ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
