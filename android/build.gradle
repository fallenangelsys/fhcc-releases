buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

// Repositories stehen ausschliesslich in settings.gradle. Dort steht
// FAIL_ON_PROJECT_REPOS, und jede Deklaration hier wuerde den Build abbrechen
// lassen ("repository 'Google' was added by build file").
tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
