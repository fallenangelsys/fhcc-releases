plugins {
    id 'com.android.application'
}

android {
    namespace 'de.fallenheaven.controlcenter'
    compileSdk 35

    defaultConfig {
        applicationId 'de.fallenheaven.controlcenter'
        // Android 8: ab hier sind Vordergrund-Dienste und Keystore verfuegbar.
        minSdk 26
        targetSdk 35
        versionCode 40103
        versionName '4.1.3'
    }

    buildTypes {
        release {
            // Eigener Keystore: FHCC-Android-Release.jks
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
    }

    signingConfigs {
        release {
            // Werte kommen aus android/keystore.properties, das NICHT
            // eingecheckt wird. Ohne Datei ist nur ein Debug-Build moeglich.
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Die Node-Laufzeit wird als Asset mitgeliefert und beim ersten Start in
    // den App-Speicher entpackt. Sonst laesst sich keine APK erzeugen, die
    // den Bot selbst startet.
    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
        }
    }

    packagingOptions {
        // Binaries der Node-Laufzeit muessen unveraendert bleiben.
        jniLibs {
            useLegacyPackaging false
            keepDebugSymbols += '**/*.so'
        }
        resources {
            excludes += ['META-INF/**']
        }
    }

    // Die 2,4 MB UI plus die Node-Laufzeit sind klein genug fuer ein Bundle.
    bundle {
        language { enableSplit = false }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
